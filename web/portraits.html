<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Office Overtime portraits</title>
    <style>
      :root {
        color-scheme: light;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      body {
        margin: 0;
        padding: 0 24px 64px;
        background: #14120f;
        color: #f0ece4;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        gap: 24px;
        align-items: center;
        padding: 14px 0;
        background: #14120fee;
        backdrop-filter: blur(4px);
      }
      h2 {
        margin: 32px 0 12px;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #8a8377;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--scale), 1fr));
        gap: 20px 14px;
      }
      .tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin: 0;
        text-align: center;
      }
      .pixels {
        width: var(--scale);
        height: var(--scale);
        image-rendering: pixelated;
        border-radius: 3px;
      }
      body[data-bg='paper'] .pixels {
        background: #fbf7ef;
      }
      body[data-bg='dark'] .pixels {
        background: #22201c;
      }
      body[data-bg='checker'] .pixels {
        background:
          repeating-conic-gradient(#3a3630 0 25%, #2a2722 0 50%) 0 0 / 12px 12px;
      }
      figcaption {
        font-size: 11px;
        line-height: 1.25;
        max-width: var(--scale);
      }
      .note {
        font-size: 10px;
        color: #8a8377;
      }
      .tile i {
        width: 100%;
        max-width: var(--scale);
        height: 3px;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <script
      type="module"
      src="/src/displays/arcade/games/office-overtime/art/preview.ts"
    ></script>
  </body>
</html>

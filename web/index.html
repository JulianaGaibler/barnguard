<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!--
      Added to a home screen, the page opens as an app with no browser around it.
      Each display brings its own manifest, icon and title once it is chosen, see
      core/pwa/installable.ts.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Barnguard Booth</title>
    <!--
      Apply the stored UI scale before the bundle loads so the first paint is
      already at the right size (no flash of unscaled content). The Svelte store
      in core/ui/uiScale.ts owns it from mount on.
    -->
    <script>
      try {
        var s = parseFloat(localStorage.getItem('bg.uiScale') || '')
        if (s && s > 0)
          document.documentElement.style.setProperty('--ui-scale', String(s))
      } catch (e) {
        /* storage blocked; fall back to the CSS default of 1 */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

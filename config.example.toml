# barnguard printer-daemon configuration.
# Copy to `config.toml` and edit, or override any key via env
# vars named PRINTER_DAEMON_<KEY> (e.g. PRINTER_DAEMON_BACKEND=tcp).

# "mock"  -> simulated printer; writes received JPEGs to `mock.out_dir`.
# "tcp"   -> real Brother VC-500W over the network (requires [printer].host).
# "usb"   -> real Brother VC-500W over USB (see [usb]).
backend = "mock"

# Address the HTTP + SSE server binds to. The web app reaches it here.
bind = "127.0.0.1:9110"

# Browser origins allowed by CORS. In dev the Vite proxy makes requests
# same-origin so this isn't strictly needed; on the kiosk (app served from a
# static server / file://) keep it permissive; there is no security boundary
# on the locked-down booth network.
allowed_origins = ["http://localhost:5173"]

# Max entries kept in the in-memory message log shown in the attendant panel.
log_buffer_size = 100

# Directory for persisted state (state.json, games.json). Created on boot if
# missing. Relative paths resolve against the working directory. For systemd
# deploys, point this at something writable like /var/lib/barnguard.
data_dir = "./data"

[client]
# Values served to the web app. Reloadable at runtime: edit this file, then hit
# "Reload config" in the attendant panel's Debug section (no restart needed).
# Other sections below take effect only on a full daemon restart.
#
# URL printed top-right on every result label.
label_url = "mzl.la/enterprise"

# Booth position, in degrees, north and east positive. The arcade launcher uses
# it to place the sun, so its sky tracks real sunrise, noon and dusk.
latitude = 52.52
longitude = 13.405

# IANA zone name. Only the launcher's wall-clock dev overrides (?time, ?date)
# resolve against it. The sky itself runs on UTC, so DST needs no handling.
timezone = "Europe/Berlin"

[printer]
# Reserved static IP / mDNS host of the VC-500W (tcp backend only).
host = ""
port = 9100
connect_timeout_ms = 3000
response_timeout_ms = 10000
# Long timeout for the completion ack after the JPEG is sent.
print_timeout_ms = 120000

[usb]
# USB backend only. Timeouts come from [printer] above.
#
# Setting up a USB printer, step by step:
#   1. Plug the printer into this machine and switch it on. Press its power
#      button if it's asleep: a sleeping printer disappears from USB.
#   2. Linux only (skip on macOS, and on NixOS, where the flake's module does
#      this): give your user permission to use the printer. By default only
#      root can access USB devices, so without this step every command below
#      fails with "permission denied". Run these once, replacing YOUR_USER
#      with the account that runs barnguard-server:
#        sudo groupadd barnguard
#        sudo usermod -aG barnguard YOUR_USER
#        echo 'SUBSYSTEM=="usb", ENV{DEVTYPE}=="usb_device", ATTR{idVendor}=="04f9", ATTR{idProduct}=="20b0", MODE="0660", GROUP="barnguard"' | sudo tee /etc/udev/rules.d/70-barnguard.rules
#        sudo udevadm control --reload-rules
#      Then log out and back in (so the new group applies), and unplug the
#      printer and plug it back in (so the rule applies).
#   3. Stop barnguard-server if it's running. Only one program can use the
#      printer at a time. Then run:
#        ./barnguard-server usb-probe
#      It should list the printer, then test whether the printer answers over
#      USB, and end with a line like:
#        5/5 replies. Suggested usb.read_mode = "bidirectional".
#      Set read_mode below to the suggested value.
#   4. Find out what makes the printer cut. Print the built-in test label
#      with each trigger:
#        ./barnguard-server usb-probe --print --cut-trigger none
#        ./barnguard-server usb-probe --print --cut-trigger zlp
#        ./barnguard-server usb-probe --print --cut-trigger soft_reset
#      A good cut gives a separate label with its border intact on all four
#      sides. Set cut_trigger below to the first trigger that does that.
#   5. Set `backend = "usb"` at the top of this file and start the server.
#      Print a label from the game, and check the printer panel shows a real
#      state (not "estimated").
#
# If the probe says the interface is busy, stop other print software (and, on
# macOS, remove the printer from System Settings > Printers & Scanners).
vendor_id = "04f9"
product_id = "20b0"
# Pick this printer when several are plugged in. Empty means the first found.
serial = ""
# "bidirectional" -> read every reply, like the tcp backend (preferred).
# "write_only"    -> send jobs blind, for hosts where the printer never answers
#                    over USB. State is ESTIMATED: a label left in the slot goes
#                    unseen and the next label is lost, so stand the printer
#                    upright so labels drop out by gravity. Jobs finish with an
#                    "unverified_usb" warning.
read_mode = "bidirectional"
# What ends a job so the printer cuts. Over TCP, closing the socket does it;
# USB has no equivalent. "none" | "zlp" (zero-length packet) | "soft_reset".
# Try each with `usb-probe --print --cut-trigger <x>` (step 4 above).
cut_trigger = "none"
# Keep the USB interface claimed between jobs. Set false to release and
# reclaim it around every label.
hold_interface = true
# write_only only: how long one label is assumed to take. Must be less than
# timing.idle_timeout_ms - timing.cut_wait_ms.
write_only_print_ms = 15000

[print]
mode = "vivid"      # "vivid" (317 lpi) | "normal" (264 lpi, faster)
cut_mode = "full"   # "full" | "half" | "none"
# 0 => let the printer autofit (recommended). The web app renders the JPEG at
# the correct square pixel dimensions; the printer scales to the tape width.
img_width = 0
img_height = 0

[timing]
# Wait after closing the socket (which triggers the cut) before reconnecting.
cut_wait_ms = 3000
# Interval between status polls while waiting for the printer to return to idle.
poll_interval_ms = 2500
# Give up waiting for idle after this long (the label has almost certainly
# printed; surfaced as a warning, not a failure).
idle_timeout_ms = 30000
# Idle status poll cadence. Adaptive: the daemon uses the SLOW
# `keepalive_interval_ms` when the booth is quiet (just enough to prevent the
# printer's auto-sleep), and ramps up to the FAST `active_interval_ms` while a
# job is running or recently finished, so the panel stays fresh during use.
# After `active_linger_ms` with no activity it relaxes back to the slow rate.
keepalive_interval_ms = 30000
active_interval_ms = 3000
active_linger_ms = 30000
# Whole-job retries on timeout/disconnect. Kept at 1 to avoid duplicate labels.
max_retries = 1

[mock]
out_dir = "./mock-out"
print_ms = 1500
cut_ms = 800
# Default tape width the mock reports (mm). 25mm ≈ the common CZ-1004 cassette.
tape_width_mm = 25.0
# Start-up fault injection (also toggleable live via POST /api/printer/debug/mock).
force_no_media = false
force_awaiting_removal = false
